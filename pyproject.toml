[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-scattering"
version = "0.1.0"
description = "Finite-volume lattice scattering, amplitude analysis, and spectrum fitting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
authors = [{name = "Si-Yang Chen"}]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/Si-Yang-Chen/lattice-scattering"
Documentation = "https://github.com/Si-Yang-Chen/lattice-scattering/tree/main/docs"
Issues = "https://github.com/Si-Yang-Chen/lattice-scattering/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lattice-scattering = "lattice_scattering.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m \"not slow\""
markers = ["slow: expensive high-order and multi-frame numerical acceptance checks"]
